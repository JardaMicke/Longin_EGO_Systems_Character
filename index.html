
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompanionAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Attention-grabbing selected avatar animations */
        @keyframes breathing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        @keyframes selected-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(219, 39, 119, 0.3), inset 0 0 0 2px rgba(219, 39, 119, 0.5); }
            50% { box-shadow: 0 0 20px rgba(219, 39, 119, 0.7), inset 0 0 0 2px rgba(219, 39, 119, 0.8); }
        }
        .avatar-selected {
            animation: breathing 3s ease-in-out infinite, selected-glow 2s ease-in-out infinite;
            filter: contrast(1.1) saturate(1.1);
            transition: filter 0.3s ease;
        }

        /* Idle Animations */
        @keyframes idle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        @keyframes idle-sigh {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.97); opacity: 0.9; }
        }
        @keyframes idle-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-1px); }
            75% { transform: translateX(1px); }
        }
        @keyframes idle-sway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
        }
        @keyframes idle-pulse-fast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-idle-happy { animation: idle-bounce 2s ease-in-out infinite; }
        .animate-idle-sad { animation: idle-sigh 4s ease-in-out infinite; }
        .animate-idle-energetic { animation: idle-pulse-fast 1s ease-in-out infinite; }
        .animate-idle-calm { animation: breathing 5s ease-in-out infinite; }
        .animate-idle-angry { animation: idle-shake 0.5s ease-in-out infinite; }
        .animate-idle-mysterious { animation: selected-glow 4s ease-in-out infinite; }
        .animate-idle-seductive { animation: idle-sway 3s ease-in-out infinite; }

        /* Rich Text Backstory Styles */
        .backstory-content img {
            max-width: 100%;
            border-radius: 1rem;
            margin: 1rem 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .backstory-content ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin: 1rem 0;
        }
        .backstory-content ol {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin: 1rem 0;
        }
        .backstory-content h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem; }
        .backstory-content h2 { font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem; }
        .backstory-content blockquote {
            border-left: 4px solid #db2777;
            padding-left: 1rem;
            font-style: italic;
            margin: 1rem 0;
            background: rgba(219, 39, 119, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }
    </style>
<script type="importmap">
{

}
