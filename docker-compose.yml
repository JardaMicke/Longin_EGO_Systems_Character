version: '3.8'

services:
  # 1) Databazova vrstva pro Semantica (Neo4j Graph Database)
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/semantica_password
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    networks:
      - companion-network

  # 2) Python Backend (Semantica integrace)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=semantica_password
      - HOST_OLLAMA_URL=http://host.docker.internal:11434
      - HOST_COMFYUI_URL=http://host.docker.internal:8188
      - HOST_LMSTUDIO_URL=http://host.docker.internal:1234
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./local_disk:/local_disk # Zpristupneni lokalniho disku pro cteni modelů/dat
    depends_on:
      - neo4j
    networks:
      - companion-network

  # 3) Puvodni React Aplikace (Frontend)
  companion-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=http://backend:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./local_disk:/local_disk
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - companion-network

networks:
  companion-network:
    driver: bridge

volumes:
  neo4j_data:
